<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cardápio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Cardápio</h1>
</header>

<div class="container">

  <!-- Django fará um for aqui -->
  <div class="card">
    <h3>Pizza Calabresa</h3>
    <p>Calabresa, queijo, cebola</p>
    <p class="price">R$ 35,00</p>

    <!-- Django vai gerar o link do WhatsApp -->
    <a class="btn" href="#">Pedir pelo WhatsApp</a>
  </div>

</div>

</body>
</html>
